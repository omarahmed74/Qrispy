<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qrispy Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/register.css">
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-card">
    <img src="../assets/img/Qrispy_dark.svg" alt="Qrispy" class="brand-logo">
    <h2>Create Account</h2>
    <p class="subtitle">Join us and start ordering today</p>

    <div class="alert alert-danger alert-auth" role="alert">
      <i class="fa-solid fa-circle-exclamation me-2"></i>
    </div>
    <div class="alert alert-success alert-auth" role="alert">
      <i class="fa-solid fa-circle-check me-2"></i>Account created! <a href="login.html" class="auth-link">Sign in now</a>
    </div>

    <div class="mt-3">
        <label for="firstName">First Name</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
          <input type="text" id="firstName" class="form-control" placeholder="Your Name">
        </div>

    </div>

    <div class="mt-3">
      <label for="regEmail">Email Address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
        <input type="email" id="regEmail" class="form-control" placeholder="you@example.com">
      </div>
    </div>
    <div class="mt-3">
      <label for="regPassword">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" id="regPassword" class="form-control" placeholder="Min. 8 characters">
        <span class="input-group-text toggle-pass">
          <i class="fa-regular fa-eye"></i>
        </span>
      </div>
      <div class="strength-text text-secondary" id="strengthText"></div>
    </div>

  <button class="btn btn-brand" >
      <i class="fa-solid fa-user-plus me-2"></i>Create Account
  </button>

  <div class="divider">or</div>

  <p class="text-center mb-0" style="font-size:.9rem; color:#777">
      Already have an account? <a href="login.html" class="auth-link">Sign in</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
